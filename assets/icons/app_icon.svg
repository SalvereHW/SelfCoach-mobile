<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern gradient for professional look -->
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
    
    <!-- Icon gradient -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E3F2FD;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners for modern app icon -->
  <rect width="1024" height="1024" rx="200" ry="200" fill="url(#backgroundGradient)" />
  
  <!-- Main icon container -->
  <g transform="translate(512, 512)">
    
    <!-- Heart shape (wellness/health symbol) -->
    <g transform="translate(0, -50)" filter="url(#shadow)">
      <path d="M-80,-40 C-80,-80 -40,-100 0,-60 C40,-100 80,-80 80,-40 C80,0 0,80 0,80 C0,80 -80,0 -80,-40 Z" 
            fill="url(#iconGradient)" 
            stroke="rgba(255,255,255,0.3)" 
            stroke-width="4"/>
    </g>
    
    <!-- Pulse line (activity/monitoring) -->
    <g transform="translate(0, 80)" opacity="0.9">
      <path d="M-120,0 L-80,0 L-60,-30 L-40,30 L-20,-40 L0,40 L20,-30 L40,0 L120,0" 
            fill="none" 
            stroke="url(#iconGradient)" 
            stroke-width="8" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>
    
    <!-- Subtle dots for design accent -->
    <circle cx="-140" cy="120" r="8" fill="rgba(255,255,255,0.4)"/>
    <circle cx="140" cy="120" r="8" fill="rgba(255,255,255,0.4)"/>
    <circle cx="-140" cy="-120" r="8" fill="rgba(255,255,255,0.4)"/>
    <circle cx="140" cy="-120" r="8" fill="rgba(255,255,255,0.4)"/>
    
  </g>
  
  <!-- Subtle overlay for premium finish -->
  <rect width="1024" height="1024" rx="200" ry="200" 
        fill="url(#iconGradient)" 
        opacity="0.1"/>
</svg>